name: Bug Report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve our project. Please fill in the details below.

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要描述你遇到的问题。
      placeholder: 例如：点击设置页面后应用闪退。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序填写可稳定复现问题的步骤。
      placeholder: |
        1. 打开应用
        2. 进入 xxx 页面
        3. 点击 xxx
        4. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 你认为正确的逻辑是什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 例如 v1.0.2
      placeholder: v1.0.2
      
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 粘贴日志或拖拽截图，能显著提高排查效率。
      render: shell
